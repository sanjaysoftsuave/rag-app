tickets_dir: data/tickets
store_dir: data/store

# How text is windowed. Drop your files into tickets_dir — `.md`/`.txt` load as
# documents cited by filename, `.pdf` loads as one citable source per page —
# then build the index from the app's "Add documents" tab.
#
# Every source is windowed on its own: a .md/.txt file as a whole, a PDF one
# page at a time. Nothing is ever concatenated with anything else, so a chunk
# can never contain text from two sources and a citation always names the one
# place its text came from.
#
# chunk_size is CHARACTERS, not tokens, and the embedding model has its own
# ceiling. Above it the tail of every chunk is silently dropped before it is
# embedded — not a trade-off, just invisible text. Measured limits:
#
#   all-MiniLM-L6-v2   256 tokens  (~1000 chars)
#   bge-small-en-v1.5  512 tokens  (~2000 chars)   <- active
#   e5-small-v2        512 tokens  (~2000 chars)
#
# `python -m rag_app models` prints these. Stay under the active model's limit.
chunking:
  chunk_size: 500
  overlap: 100

# To compare several configurations side by side, replace the `chunking` block
# above with a `chunk_presets` map plus `default_preset`, e.g.
#
#   chunk_presets:
#     small: {chunk_size: 500,  overlap: 100}
#     large: {chunk_size: 1000, overlap: 100}
#   default_preset: small
#
# `chunks --all` and the UI's preset selector start working again with no code
# change; each preset gets its own index directory.

# bge-small is the same 384 dimensions and size class as all-MiniLM-L6-v2, with
# twice the input window and stronger MTEB retrieval scores. It is asymmetric:
# the QUERY needs an instruction prefix and passages stay bare. That prefix is
# applied automatically from embed.MODEL_REGISTRY — getting it wrong degrades
# retrieval with no error, which is exactly why the registry exists.
#
# Changing this requires a re-ingest: the store records which model built it
# and refuses to serve queries from a different one.
bi_encoder_model: BAAI/bge-small-en-v1.5
cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2

retrieve_k: 10
rerank_n: 3

# The cross-encoder emits unbounded logits (roughly -11..+11). Squashing them
# through a sigmoid puts the gate on a calibrated 0-1 scale, so 0.5 means
# "the model considers this more relevant than not" instead of being an
# arbitrary point on a raw logit axis.
#
# 0.20 is a starting point measured on a different corpus, and it will NOT
# transfer to yours. Tune it in the UI: drag score_threshold and watch which
# questions flip between answered and refused. Too high and real answers get
# refused; too low and the model is handed excerpts that do not contain the
# answer and invited to improvise.
rerank_score_scale: sigmoid
score_threshold: 0.20

# dense  = bi-encoder cosine only.
# hybrid = dense + BM25 keyword search, fused by Reciprocal Rank Fusion.
#          See hybrid.py for why RRF rather than a weighted score blend.
#
# Dense finds "why do I keep getting cut off" when the text says "rate limit
# exceeded" — meaning, no shared words. BM25 finds "ERR-4032" — an exact token
# dense retrieval treats as just another point in embedding space. They fail in
# complementary ways, which is the argument for fusing them.
#
# `dense` is the default because hybrid earns its keep on keyword-heavy corpora
# (error codes, part numbers, proper nouns) and costs a little precision on
# prose. Switch it in the UI sidebar and compare on your own questions.
retrieval:
  mode: dense
  rrf_k: 60       # RRF's rank-discount constant; 60 is the standard TREC value
  bm25_pool: 20   # BM25 candidates pulled into the fusion pool

# Qdrant is the only vector store — no in-process numpy fallback.
# url: null runs embedded (a local file, zero setup) — same brute-force search
# under the hood, just via the real Qdrant API/persistence format.
# Embedded mode accepts m/ef_construct/hnsw_ef below and silently ignores
# them; they only take effect once you point url at a real server:
#   docker run -p 6333:6333 -v qdrant_storage:/qdrant/storage qdrant/qdrant
# See qdrant_store.py's module docstring before quoting HNSW numbers.
qdrant:
  url: null
  m: 16
  ef_construct: 100
  hnsw_ef: 128

llm:
  base_url: https://openrouter.ai/api/v1
  # Change model anytime: https://openrouter.ai/models
  model: openai/gpt-4o-mini
  temperature: 0.0
  timeout_seconds: 30
