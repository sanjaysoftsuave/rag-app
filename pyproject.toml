[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-app"
version = "0.1.0"
description = "Plain-Python RAG over support tickets: dense retrieve + cross-encoder rerank + grounded generation via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=3.0.0",
  "torch>=2.0.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "qdrant-client>=1.9.0",
  # Pure Python, no system libraries — matters on Windows, where pdfminer/
  # poppler-backed alternatives need a toolchain this project otherwise avoids.
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# The browser UI is optional: the CLI is the primary surface and must keep
# working without streamlit (and without pulling its dependency tree) installed.
# 1.62 is the version this was verified against; `width="stretch"` on dataframes
# and buttons replaced `use_container_width`, whose removal date has passed.
ui = ["streamlit>=1.62.0"]
pdf = ["pypdf>=4.0.0"]
# Week 7's framework arm. Deliberately TWO extras, not one: mem0ai brings its
# own vector store and LLM client and is the likeliest thing to disturb the
# pinned openai/qdrant-client/torch in this venv, so it must be installable (and
# skippable) independently of langgraph.
#
# Nothing on the path that answers a question imports either one --
# tests/test_no_framework_imports.py fails the build if that changes.
agents = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
mem0 = ["mem0ai>=0.1.0"]
# Week 9's framework arm. Same shape as `agents`/`mem0`: nothing on the path
# that answers a question imports either package -- tests/test_no_framework_
# imports.py fails the build if that changes. mcp_client.py uses the
# low-level `mcp` SDK (so the raw JSON-RPC handshake stays visible);
# mcp_server.py builds on `fastmcp`, which depends on `mcp` itself, so both
# are listed for clarity even though installing one pulls the other.
mcp = ["mcp>=2.2.0", "fastmcp>=4.0.0"]

[project.scripts]
rag-app = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
